name: build

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths-ignore:
      - 'LICENSE'
      - '*.md'
      - '.github/**'

jobs:
  build-android:
    runs-on: ubuntu-latest
    # GitHub 默认给 GITHUB_TOKEN 只读权限, 创建 Release 需要 contents: write
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # SwD 专属签名(didigkd.jks / CN=DidiGKD / 有效期至 2056)。
      # ⚠️ 签名一旦发出去就不能再换 —— 换了所有用户都无法覆盖安装。
      - name: write keystore
        run: echo ${{ secrets.ANDROID_KEYSTORE_BASE64 }} | base64 --decode > ${{ github.workspace }}/didigkd.jks

      - run: ./gradlew :gkd-android:assembleGkdRelease
        env:
          GKD_STORE_FILE: ${{ github.workspace }}/didigkd.jks
          GKD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GKD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GKD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: didigkd-apk
          path: gkd-android/build/outputs/apk/gkd/release/*.apk

      # 发成 latest Release 附件 —— artifact 下载在国内经常卡断/404，
      # Release 走另一条 CDN，且顺带给出固定的分发链接。
      - name: publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(ls gkd-android/build/outputs/apk/gkd/release/*.apk | head -1)
          echo "APK=$APK"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$APK" --clobber
          else
            gh release create latest --target "$GITHUB_SHA" \
              --title "SwD latest" \
              --notes "每次 main 分支构建自动发布，仅供内测" \
              --prerelease "$APK"
          fi
